esphome:
  name: lilygo
  platformio_options:
    # Unless noted otherwise, based on https://github.com/Xinyuan-LilyGO/LilyGo-EPD47/blob/1eb6119fc31fcff7a6bafecb09f4225313859fc5/examples/demo/platformio.ini#L37
    upload_speed: 921600
    monitor_speed: 115200
    board_build.mcu: esp32s3
    board_build.f_cpu: 240000000L
    board_build.arduino.memory_type: qspi_opi
    board_build.flash_size: 16MB
    board_build.flash_mode: qio
    board_build.flash_type: qspi
    board_build.psram_type: opi
    board_build.memory_type: qspi_opi
    board_build.boot_freq: 80m
    build_flags:  # the first three defines are required for the screen library to function.
      - "-DBOARD_HAS_PSRAM"
      - "-DARDUINO_RUNNING_CORE=0"  # TODO: this conflicts with the value from platformio's idedata, spewing a lot of warnings during the build.
      - "-DARDUINO_EVENT_RUNNING_CORE=0"  # and this too
      # In addition to lilygo's settings:
      # To enable reading logs over USB until `hardware_uart: USB_CDC` support
      # is added to `logger:`, as detailed in <https://github.com/esphome/feature-requests/issues/1906>:
      - "-DARDUINO_USB_MODE=1"
      - "-DARDUINO_USB_CDC_ON_BOOT=1"

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1

  framework:
    type: arduino
    version: recommended  # Arduino 3.x required by ESPHome 2026.4+

logger:
  level: VERBOSE
  # hardware_uart: USB_CDC  # see note about <https://github.com/esphome/feature-requests/issues/1906> above

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret api_ota_password

wifi: !include wifi-secrets.yaml

# NOTE: The physical button (S3) is wired through the PCA9535 GPIO expander
# (I2C 0x20, pin IO1_2), NOT to a direct GPIO. GPIO21 is SPI MISO.

# NOTE: GPIO17/18 are EPD parallel data lines (EP_D5/EP_D6), not SPI pins.

external_components:
  - source:
      type: local
      path: components/
    components: ["t5s3_epaper"]

time:
  - platform: homeassistant
    id: ntp

font:
  - file: "fonts/arial.ttf"
    id: my_font
    size: 40
  
  - file: "gfonts://Roboto"
    id: roboto16
    size: 16

  - file: "gfonts://Roboto"
    id: roboto20
    size: 20
  
  - file: "gfonts://Roboto"
    id: roboto24
    size: 24

  - file: "gfonts://Roboto"
    id: roboto40
    size: 40

  - file: "gfonts://Roboto"
    id: roboto60
    size: 60


display:
  - platform: t547
    id: t5_display
    rotation: 270
    update_interval: 60s
    lambda: |-
      #define xres 540 
      #define yres 960
      #define x_pad 10 // border padding
      #define y_pad 10 // border padding      
      #define cat_pad 85 // padding before category
      #define val_pad 70 // padding before value
      #define icon_pad 35 //padding after icons      
      #define x1n 20 //x position 1st column name
      #define x1v 25 //x position 1st column value
      #define x1i 50 //x position 1st column icon
      #define x2n xres/2 //x position 2nd column name
      #define x2v xres/2 //x position 2nd column value
      #define x2i xres/2 //x position 1st column icon
      
      int y = 0;
      
      // Date
      it.strftime(xres/2, y+y_pad, id(roboto24), TextAlign::TOP_CENTER, "%A %d/%b/%Y", id(ntp).now());