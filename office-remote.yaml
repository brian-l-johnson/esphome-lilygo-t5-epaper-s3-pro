esphome:
  name: lilygo
  on_boot:
    # Render the boot screen as soon as the display is ready, before WiFi.
    priority: -100
    then:
      - component.update: t5_display
      # Fallback: if WiFi never comes up, time out the boot screen after 30s.
      - delay: 30s
      - lambda: |-
          if (!id(boot_done)) {
            id(boot_done) = true;
            id(t5_display).request_full_refresh();
            id(t5_display).update();
          }
  platformio_options:
    upload_speed: 921600
    monitor_speed: 115200
    board_build.flash_size: 16MB
    board_build.flash_mode: qio
    board_build.memory_type: qio_opi
    # epdiy's epd_board_common.c needs esp_adc headers to compile (excluded by ESPHome).
    # lilygo_board_s3 never calls those ADC functions so they'll be GC'd at link time.
    # Adjust the path if your PlatformIO is not at ~/.platformio.
    build_flags:
      - "-I${sysenv.HOME}/.platformio/packages/framework-espidf/components/esp_adc/include"
      - "-I${sysenv.HOME}/.platformio/packages/framework-espidf/components/esp_adc/esp32s3/include"
      - "-DBOARD_HAS_PSRAM"

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1

  framework:
    type: esp-idf
    # The epdiy Frogy76 fork links in the new i2c_master driver (driver_ng) via
    # lilygo_board_s3.c / epd_board_v7.c etc.  ESP-IDF 5.5.4 has an
    # __attribute__((constructor)) in the legacy i2c driver that aborts if
    # driver_ng symbols are present in the binary.  Our board definition uses
    # the legacy driver (driver/i2c.h), so we skip the conflict check.
    # The new driver is linked but never initialised at runtime.
    sdkconfig_options:
      CONFIG_I2C_SKIP_LEGACY_CONFLICT_CHECK: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      # OCT PSRAM on this board (APS6408) supports 80 MHz. The IDF default
      # is 40 MHz, which halves the throughput of every framebuffer write —
      # the YAML render lambda dropped from ~2 s to expected ~500 ms with 80M.
      CONFIG_SPIRAM_SPEED_40M: n
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_MEMTEST_ON_INIT: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      # epdiy's check_cache_configuration() halves the pixel clock when the
      # data cache line size is < 64B — and it's called twice during init, so
      # the wrong setting drops 8 MHz → 2 MHz (a 4× refresh slowdown).
      # The IDF default on this variant is 32B; both options below are needed
      # to actually flip the choice group.
      CONFIG_ESP32S3_DATA_CACHE_LINE_32B: n
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

logger:
  # DEBUG fires many lines per refresh + per touch; over USB-CDC the buffer
  # can back-pressure the main thread and add 1-2 s to renders. INFO keeps
  # the touch / climate / warning lines we actually use.
  level: INFO
  # hardware_uart: USB_CDC  # see note about <https://github.com/esphome/feature-requests/issues/1906> above

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - logger.log: "HA client connected — scheduling full display refresh"
    - lambda: |-
        id(boot_done) = true;
        id(t5_display).request_full_refresh();
    - component.update: t5_display
  on_client_disconnected:
    - logger.log: "HA client disconnected"
    - lambda: 'id(t5_display).request_refresh();'

ota:
  platform: esphome
  password: !secret api_ota_password

wifi: !include wifi-secrets.yaml

time:
  - platform: homeassistant
    id: ntp

globals:
  - id: active_room
    type: int
    restore_value: true
    initial_value: '0'   # 0 = Office, 1 = Living Room
  - id: last_touch_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: show_room_picker
    type: bool
    restore_value: false
    initial_value: 'false'
  # Living Room TV — input picker overlay + live source_list from HA
  - id: show_input_picker
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: tv_source_list
    type: std::vector<std::string>
    restore_value: false
  # Charger-auto-clock state
  - id: previous_room
    type: int
    restore_value: false
    initial_value: '0'   # restored when charger unplugs / diagnostics exit
  - id: was_on_charger
    type: bool
    restore_value: false
    initial_value: 'false'   # tracks transitions
  # Boot screen — cleared once WiFi is up + grace delay
  - id: boot_done
    type: bool
    restore_value: false
    initial_value: 'false'

binary_sensor:
  # Office
  - platform: homeassistant
    id: office_lights_state
    entity_id: light.office_lights
    internal: true
    on_state:
      - lambda: |-
          id(t5_display).clear_optimistic(0);
          if (id(active_room) == 0) id(t5_display).request_refresh();
  # Living Room
  - platform: homeassistant
    id: living_room_main_state
    entity_id: light.living_room_main_lights
    internal: true
    on_state:
      - lambda: |-
          id(t5_display).clear_optimistic(1);
          if (id(active_room) == 1) id(t5_display).request_refresh();
  - platform: homeassistant
    id: living_room_upstairs_state
    entity_id: light.upstairs_living_room
    internal: true
    on_state:
      - lambda: |-
          id(t5_display).clear_optimistic(2);
          if (id(active_room) == 1) id(t5_display).request_refresh();
  - platform: homeassistant
    id: ceiling_fan_state
    entity_id: switch.living_room_ceiling_fan
    internal: true
    on_state:
      - lambda: |-
          id(t5_display).clear_optimistic(3);
          if (id(active_room) == 1) id(t5_display).request_refresh();
  # Climate
  - platform: homeassistant
    id: hrv_state
    entity_id: switch.hrv
    internal: true
    on_state:
      - lambda: |-
          id(t5_display).clear_optimistic(4);
          if (id(active_room) == 2) id(t5_display).request_refresh();

sensor:
  # Thermostat — main
  - platform: homeassistant
    id: thermo_current_temp
    entity_id: climate.thermostat
    attribute: current_temperature
    internal: true
    filters:
      - delta: 0.5
    on_value:
      - lambda: 'if (id(active_room) == 2) id(t5_display).request_refresh();'
  - platform: homeassistant
    id: thermo_set_temp
    entity_id: climate.thermostat
    attribute: temperature
    internal: true
    filters:
      - delta: 0.5
    on_value:
      - lambda: 'if (id(active_room) == 2) id(t5_display).request_refresh();'
  # Thermostat — upstairs
  - platform: homeassistant
    id: thermo_up_current_temp
    entity_id: climate.upstairs_thermostat
    attribute: current_temperature
    internal: true
    filters:
      - delta: 0.5
    on_value:
      - lambda: 'if (id(active_room) == 2) id(t5_display).request_refresh();'
  - platform: homeassistant
    id: thermo_up_set_temp
    entity_id: climate.upstairs_thermostat
    attribute: temperature
    internal: true
    filters:
      - delta: 0.5
    on_value:
      - lambda: 'if (id(active_room) == 2) id(t5_display).request_refresh();'

  # Office lights brightness (attribute 0–255)
  - platform: homeassistant
    id: office_lights_brightness
    entity_id: light.office_lights
    attribute: brightness
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 0) id(t5_display).request_refresh();'
  # Plexamp volume (attribute 0.0–1.0)
  - platform: homeassistant
    id: plexamp_volume
    entity_id: media_player.plex_plexamp_office
    attribute: volume_level
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 0) id(t5_display).request_refresh();'
  # Living Room TV (Savant zone) — zone volume 0.0–1.0
  - platform: homeassistant
    id: lr_tv_volume
    entity_id: media_player.living_room
    attribute: volume_level
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 5) id(t5_display).request_refresh();'

  - platform: template
    id: battery_pct
    name: "Battery Percent"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    update_interval: 60s
    lambda: return id(t5_display).get_battery_pct();

  - platform: template
    id: battery_mv
    name: "Battery Voltage"
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    device_class: voltage
    update_interval: 60s
    lambda: return id(t5_display).get_battery_mv();

  - platform: template
    id: battery_ma
    name: "Battery Current"
    unit_of_measurement: "mA"
    accuracy_decimals: 0
    device_class: current
    update_interval: 60s
    lambda: return id(t5_display).get_battery_ma();

text_sensor:
  # Plexamp / media player
  - platform: homeassistant
    id: plexamp_state
    entity_id: media_player.plex_plexamp_office
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 0) id(t5_display).request_refresh();'
  - platform: homeassistant
    id: plexamp_title
    entity_id: media_player.plex_plexamp_office
    attribute: media_title
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 0) id(t5_display).request_refresh();'
  - platform: homeassistant
    id: plexamp_artist
    entity_id: media_player.plex_plexamp_office
    attribute: media_artist
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 0) id(t5_display).request_refresh();'
  # Thermostat modes
  - platform: homeassistant
    id: thermo_mode
    entity_id: climate.thermostat
    attribute: hvac_action
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 2) id(t5_display).request_refresh();'
  - platform: homeassistant
    id: thermo_hvac_mode
    entity_id: climate.thermostat
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 2) id(t5_display).request_refresh();'
  - platform: homeassistant
    id: thermo_up_mode
    entity_id: climate.upstairs_thermostat
    attribute: hvac_action
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 2) id(t5_display).request_refresh();'
  - platform: homeassistant
    id: thermo_up_hvac_mode
    entity_id: climate.upstairs_thermostat
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 2) id(t5_display).request_refresh();'
  # ── Living Room TV (Savant zone media_player.living_room) ──────────────
  - platform: homeassistant
    id: lr_tv_state
    entity_id: media_player.living_room
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 5) id(t5_display).request_refresh();'
  - platform: homeassistant
    id: lr_tv_source
    entity_id: media_player.living_room
    attribute: source
    internal: true
    on_value:
      - lambda: 'if (id(active_room) == 5) id(t5_display).request_refresh();'
  # source_list arrives as HA's str(list) repr, e.g. ['Cable Box', 'Apple TV'].
  # Parse the quoted items into tv_source_list for the input picker overlay.
  - platform: homeassistant
    id: lr_tv_source_list
    entity_id: media_player.living_room
    attribute: source_list
    internal: true
    on_value:
      - lambda: |-
          auto &v = id(tv_source_list);
          v.clear();
          const std::string &s = x;
          size_t i = 0;
          while (i < s.size()) {
            char c = s[i];
            if (c == '\'' || c == '"') {
              size_t j = s.find(c, i + 1);
              if (j == std::string::npos) break;
              v.push_back(s.substr(i + 1, j - i - 1));
              i = j + 1;
            } else {
              i++;
            }
          }
          ESP_LOGI("tv", "parsed %d sources from source_list", (int)v.size());
          if (id(active_room) == 5) id(t5_display).request_refresh();

  - platform: wifi_info
    ip_address:
      name: IP Address
      id: wifi_ip
    ssid:
      name: WiFi SSID
      id: wifi_ssid
    bssid:
      name: WiFi BSSID

# NOTE: The physical button (S3) on this board is wired through the PCA9535
# GPIO expander (I2C 0x20, pin IO1_2), NOT to a direct GPIO. GPIO21 is SPI
# MISO and must not be declared as a button. A custom PCA9535 sensor is needed
# to read it; omitting it for now.

# NOTE: The EPD uses a parallel data bus (GPIO4-8, 15-18, 41, 42, 45, 48).
# GPIO17 and GPIO18 are EP_D5 / EP_D6 — declaring an SPI bus on them would
# corrupt the display. The SPI bus for LoRa/SD (GPIO13/14/21) is separate and
# only needed if you use those peripherals. Removing both from this config.

external_components:
  - source:
      type: local
      path: components/
    components: ["t5s3_epaper"]

touchscreen:
  - platform: t5s3_epaper
    id: t5_touch
    display: t5_display
    update_interval: 50ms
    # Per-unit calibration. To recalibrate: temporarily bump the LOGV in
    # t5s3_touch.cpp to LOGI, flash, tap each of the 4 corners, and average
    # the RAW chip(x,y) values for each edge. Defaults baked into the
    # component match unit serial #2 (June 2026).
    calibration:
      x_min: 12
      x_max: 533
      y_min: 15
      y_max: 945
    # GT911 chip axes are swapped relative to the 960x540 display orientation.
    # Coordinate mapping done manually in on_touch lambda — raw values used directly.
    on_touch:
      - lambda: |-
          // Mapping done in t5s3_touch.cpp — touch.x = screen X (0–540), touch.y = screen Y (0–960)
          int tx = touch.x;
          int ty = touch.y;
          ESP_LOGI("touch", "screen x=%d y=%d", tx, ty);

          // Debounce — ESPHome's touchscreen fires on_touch only on finger-down
          // (sustained press doesn't re-fire), so this only filters rapid
          // intentional retaps. 150 ms allows ~6 taps/sec without doubling.
          uint32_t now_ms = millis();
          if (now_ms - id(last_touch_ms) < 150) return;
          id(last_touch_ms) = now_ms;
          // Tell the display component to defer its auto GL16 promotion
          // while the user is actively interacting.
          id(t5_display).notify_touch();

          // ── Room picker overlay (drawn over everything) ───────────────────
          if (id(show_room_picker)) {
            // Rows start at y=220, 116px tall, 120px pitch (see picker draw).
            // Maps picker rows → active_room index. Anything else cancels.
            static const int picker_indices[] = {0, 1, 2, 5};
            const int NP = sizeof(picker_indices) / sizeof(picker_indices[0]);
            int picked = -1;
            if (tx >= 30 && tx <= 510) {
              for (int i = 0; i < NP; i++) {
                int ry = 218 + i * 120;
                if (ty >= ry && ty < ry + 116) { picked = picker_indices[i]; break; }
              }
            }
            int prev = id(active_room);
            if (picked >= 0) id(active_room) = picked;
            ESP_LOGI("touch", "picker: tx=%d ty=%d picked=%d prev=%d after=%d",
                     tx, ty, picked, prev, id(active_room));
            id(show_room_picker) = false;
            id(t5_display).request_full_refresh();
            id(t5_display).update();
            return;
          }

          // ── Input picker overlay (Living Room TV) ─────────────────────────
          if (id(show_input_picker)) {
            // Rows start at y=200, 80px tall, 84px pitch (see input picker draw).
            auto &srcs = id(tv_source_list);
            int n = (int)srcs.size();
            int picked = -1;
            if (tx >= 40 && tx <= 500) {
              for (int i = 0; i < n; i++) {
                int ry = 200 + i * 84;
                if (ty >= ry && ty < ry + 80) { picked = i; break; }
              }
            }
            if (picked >= 0) id(lr_tv_select_source).execute(srcs[picked]);
            id(show_input_picker) = false;
            id(t5_display).request_full_refresh();
            id(t5_display).update();
            return;
          }

          // ── Top bar (y 0–80) ─────────────────────────────────────────────
          if (ty < 80) {
            if (tx < 420) {
              // Room name area — open picker
              id(show_room_picker) = true;
              id(t5_display).request_full_refresh();
              id(t5_display).update();
            } else {
              // Backlight toggle (right 120px)
              auto call = id(backlight_light).toggle();
              call.perform();
            }
            return;
          }

          // ── Living Room TV remote (own geometry, extends past y=700) ──────
          if (id(active_room) == 5) {
            // Power (x 384–524, y 108–168)
            if (tx >= 384 && ty >= 108 && ty <= 168) {
              id(lr_tv_power).execute();
              return;
            }
            // Input selector button (y 188–252) → open input picker
            if (ty >= 188 && ty <= 252) {
              id(show_input_picker) = true;
              id(t5_display).request_full_refresh();
              id(t5_display).update();
              return;
            }
            // D-pad cluster (+ Home in the top-left corner)
            if (ty >= 280 && ty <= 380 && tx >= 84  && tx <= 204) { id(lr_tv_cmd).execute("home");   return; }
            if (ty >= 280 && ty <= 380 && tx >= 210 && tx <= 330) { id(lr_tv_cmd).execute("up");     return; }
            if (ty >= 388 && ty <= 488) {
              if (tx >= 84  && tx <= 204) { id(lr_tv_cmd).execute("left");   return; }
              if (tx >= 210 && tx <= 330) { id(lr_tv_cmd).execute("select"); return; }
              if (tx >= 336 && tx <= 456) { id(lr_tv_cmd).execute("right");  return; }
            }
            if (ty >= 496 && ty <= 596 && tx >= 210 && tx <= 330) { id(lr_tv_cmd).execute("down");   return; }
            // Volume rocker (y 626–722)
            if (ty >= 626 && ty <= 722) {
              if      (tx >= 84  && tx < 273)  { id(lr_tv_vol_down).execute(); return; }
              else if (tx >= 276 && tx <= 462) { id(lr_tv_vol_up).execute();   return; }
            }
            return;
          }

          // ── Control rows (y 100–700, each row 120px tall) ────────────────
          if (ty < 100 || ty > 700) return;
          int row = (ty - 100) / 120;

          if (id(active_room) == 0) {
            // Office lights — read effective (optimistic-or-HA) state, then
            // optimistically flip and fire the HA toggle directly.
            int opt = id(t5_display).get_optimistic(0);
            bool lights_on = (opt >= 0) ? (opt == 1)
                : (id(office_lights_state).has_state() && id(office_lights_state).state);
            if (ty < 212) {
              id(t5_display).set_optimistic(0, !lights_on);
              id(toggle_office_lights).execute();
              id(t5_display).update();
            } else if (ty < 260) {
              // Brightness slider (y 212–260, only when lights ON)
              if (lights_on) {
                float pct = (float)(tx - 28) / 484.0f * 100.0f;
                int pct_i = (int)std::max(1.0f, std::min(100.0f, pct));
                id(set_brightness).execute(pct_i);
              }
            } else if (ty >= 268 && ty < 448) {
              // Plexamp row (y 268–448) — three transport zones
              if (tx >= 354)      id(plexamp_next).execute();
              else if (tx >= 180) id(toggle_plexamp).execute();
              else                id(plexamp_prev).execute();
            } else if (ty >= 454 && ty < 502) {
              // Volume slider (y 454–502)
              float vol = std::max(0.0f, std::min(1.0f, (float)(tx - 28) / 484.0f));
              id(set_volume).execute(vol);
            }
          } else if (id(active_room) == 1) {
            auto toggle_opt = [&](uint8_t slot, auto sensor, auto &script) {
              int opt = id(t5_display).get_optimistic(slot);
              bool cur = (opt >= 0) ? (opt == 1)
                  : (sensor->has_state() && sensor->state);
              id(t5_display).set_optimistic(slot, !cur);
              script.execute();
              id(t5_display).update();
            };
            if (row == 0)      toggle_opt(1, id(living_room_main_state),     *id(toggle_lr_main));
            else if (row == 1) toggle_opt(2, id(living_room_upstairs_state), *id(toggle_lr_upstairs));
            else if (row == 2) toggle_opt(3, id(ceiling_fan_state),          *id(toggle_lr_fan));
          } else if (id(active_room) == 2) {
            // Climate tab — each thermostat row is 220px tall, split into:
            //   top 106px (info + mode badge): tap right side → mode cycle
            //   bottom 114px (button row): split at midpoint → minus / plus
            // Main:     y=100-319 (top 100-205, bottom 206-319)
            // Upstairs: y=336-555 (top 336-441, bottom 442-555)
            // HRV:      y=572-691
            const char *zone = "(none)";
            if (ty >= 100 && ty < 320) {
              int rel = ty - 100;
              if (rel < 106) {
                if (tx >= 280) { id(thermo_mode_cycle).execute(); zone = "main/mode"; }
                else zone = "main/top-deadzone";
              } else {
                if (tx < 255) { id(thermo_setpoint_down).execute(); zone = "main/minus"; }
                else          { id(thermo_setpoint_up).execute();   zone = "main/plus"; }
              }
            } else if (ty >= 336 && ty < 556) {
              int rel = ty - 336;
              if (rel < 106) {
                if (tx >= 280) { id(thermo_up_mode_cycle).execute(); zone = "up/mode"; }
                else zone = "up/top-deadzone";
              } else {
                if (tx < 255) { id(thermo_up_setpoint_down).execute(); zone = "up/minus"; }
                else          { id(thermo_up_setpoint_up).execute();   zone = "up/plus"; }
              }
            } else if (ty >= 572 && ty < 692) {
              int opt = id(t5_display).get_optimistic(4);
              bool cur = (opt >= 0) ? (opt == 1)
                  : (id(hrv_state).has_state() && id(hrv_state).state);
              id(t5_display).set_optimistic(4, !cur);
              id(toggle_hrv).execute();
              id(t5_display).update();
              zone = "hrv";
            } else {
              zone = "gap";
            }
            ESP_LOGI("touch", "climate: tx=%d ty=%d zone=%s", tx, ty, zone);
          }

interval:
  # Auto-switch to clock face on/off charger (gated by the HA switch).
  - interval: 5s
    then:
      - lambda: |-
          if (!id(auto_clock_when_charging).state) return;
          bool now_charged = id(t5_display).charger_present();
          if (now_charged && !id(was_on_charger)) {
            // Plugged in — save current view, switch to clock.
            if (id(active_room) != 3) id(previous_room) = id(active_room);
            id(active_room) = 3;
            id(was_on_charger) = true;
            id(t5_display).request_full_refresh();
            id(t5_display).update();
          } else if (!now_charged && id(was_on_charger)) {
            // Unplugged — restore the previously active room.
            id(active_room) = id(previous_room);
            id(was_on_charger) = false;
            id(t5_display).request_full_refresh();
            id(t5_display).update();
          }
  # Re-render the clock face every minute so HH:MM updates.
  - interval: 60s
    then:
      - lambda: |-
          if (id(active_room) == 3) id(t5_display).request_refresh();
  # Refresh diagnostics view every 30s so battery / heap stay current.
  - interval: 30s
    then:
      - lambda: |-
          if (id(active_room) == 4) id(t5_display).request_refresh();

script:
  - id: toggle_office_lights
    then:
      - logger.log: "Toggling office lights"
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: light.office_lights
  - id: toggle_plexamp
    then:
      - homeassistant.service:
          service: media_player.media_play_pause
          data:
            entity_id: media_player.plex_plexamp_office
  - id: plexamp_prev
    then:
      - homeassistant.service:
          service: media_player.media_previous_track
          data:
            entity_id: media_player.plex_plexamp_office
  - id: plexamp_next
    then:
      - homeassistant.service:
          service: media_player.media_next_track
          data:
            entity_id: media_player.plex_plexamp_office
  - id: set_brightness
    parameters:
      pct: int
    then:
      - homeassistant.service:
          service: light.turn_on
          data_template:
            entity_id: light.office_lights
            brightness_pct: !lambda "return pct;"
  - id: set_volume
    parameters:
      level: float
    then:
      - homeassistant.service:
          service: media_player.volume_set
          data_template:
            entity_id: media_player.plex_plexamp_office
            volume_level: !lambda "return level;"
  - id: toggle_lr_main
    then:
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: light.living_room_main_lights
  - id: toggle_lr_upstairs
    then:
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: light.upstairs_living_room
  - id: toggle_lr_fan
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.living_room_ceiling_fan
  - id: thermo_setpoint_up
    then:
      - lambda: |-
          bool has = id(thermo_set_temp).has_state();
          float cur = has ? id(thermo_set_temp).state : NAN;
          ESP_LOGI("climate", "main:setpoint_up has=%d cur=%.1f -> %.1f", has, cur, has ? cur + 1.0f : 20.0f);
      - homeassistant.service:
          service: climate.set_temperature
          data_template:
            entity_id: climate.thermostat
            temperature: !lambda "return id(thermo_set_temp).has_state() ? id(thermo_set_temp).state + 1.0f : 20.0f;"
  - id: thermo_setpoint_down
    then:
      - lambda: |-
          bool has = id(thermo_set_temp).has_state();
          float cur = has ? id(thermo_set_temp).state : NAN;
          ESP_LOGI("climate", "main:setpoint_down has=%d cur=%.1f -> %.1f", has, cur, has ? cur - 1.0f : 20.0f);
      - homeassistant.service:
          service: climate.set_temperature
          data_template:
            entity_id: climate.thermostat
            temperature: !lambda "return id(thermo_set_temp).has_state() ? id(thermo_set_temp).state - 1.0f : 20.0f;"
  - id: thermo_up_setpoint_up
    then:
      - lambda: |-
          bool has = id(thermo_up_set_temp).has_state();
          float cur = has ? id(thermo_up_set_temp).state : NAN;
          ESP_LOGI("climate", "up:setpoint_up has=%d cur=%.1f -> %.1f", has, cur, has ? cur + 1.0f : 20.0f);
      - homeassistant.service:
          service: climate.set_temperature
          data_template:
            entity_id: climate.upstairs_thermostat
            temperature: !lambda "return id(thermo_up_set_temp).has_state() ? id(thermo_up_set_temp).state + 1.0f : 20.0f;"
  - id: thermo_up_setpoint_down
    then:
      - lambda: |-
          bool has = id(thermo_up_set_temp).has_state();
          float cur = has ? id(thermo_up_set_temp).state : NAN;
          ESP_LOGI("climate", "up:setpoint_down has=%d cur=%.1f -> %.1f", has, cur, has ? cur - 1.0f : 20.0f);
      - homeassistant.service:
          service: climate.set_temperature
          data_template:
            entity_id: climate.upstairs_thermostat
            temperature: !lambda "return id(thermo_up_set_temp).has_state() ? id(thermo_up_set_temp).state - 1.0f : 20.0f;"
  - id: toggle_hrv
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.hrv
  - id: thermo_mode_cycle
    then:
      - lambda: |-
          std::string m = id(thermo_hvac_mode).has_state() ? id(thermo_hvac_mode).state : std::string("(unknown)");
          ESP_LOGI("climate", "main:mode_cycle cur=%s", m.c_str());
      - homeassistant.service:
          service: climate.set_hvac_mode
          data_template:
            entity_id: climate.thermostat
            hvac_mode: !lambda |-
              if (!id(thermo_hvac_mode).has_state()) return std::string("heat");
              std::string m = id(thermo_hvac_mode).state;
              if (m == "heat") return std::string("cool");
              if (m == "cool") return std::string("off");
              return std::string("heat");
  - id: thermo_up_mode_cycle
    then:
      - lambda: |-
          std::string m = id(thermo_up_hvac_mode).has_state() ? id(thermo_up_hvac_mode).state : std::string("(unknown)");
          ESP_LOGI("climate", "up:mode_cycle cur=%s", m.c_str());
      - homeassistant.service:
          service: climate.set_hvac_mode
          data_template:
            entity_id: climate.upstairs_thermostat
            hvac_mode: !lambda |-
              if (!id(thermo_up_hvac_mode).has_state()) return std::string("heat");
              std::string m = id(thermo_up_hvac_mode).state;
              if (m == "heat") return std::string("cool");
              if (m == "cool") return std::string("off");
              return std::string("heat");

  # ── Living Room TV (Savant zone) ──────────────────────────────────────
  # Power toggles the whole zone on/off.
  - id: lr_tv_power
    then:
      - if:
          condition:
            lambda: |-
              return id(lr_tv_state).has_state()
                     && id(lr_tv_state).state != "off"
                     && id(lr_tv_state).state != "unavailable"
                     && id(lr_tv_state).state != "unknown";
          then:
            - homeassistant.service:
                service: media_player.turn_off
                data:
                  entity_id: media_player.living_room
          else:
            - homeassistant.service:
                service: media_player.turn_on
                data:
                  entity_id: media_player.living_room
  # D-pad / nav keys → active source in the zone via remote.send_command.
  - id: lr_tv_cmd
    parameters:
      command: string
    then:
      - homeassistant.service:
          service: remote.send_command
          data_template:
            entity_id: remote.living_room_living_room
            command: !lambda "return command;"
  # Zone (Savant amplifier) volume — what a TV remote's volume keys should do.
  - id: lr_tv_vol_up
    then:
      - homeassistant.service:
          service: media_player.volume_up
          data:
            entity_id: media_player.living_room
  - id: lr_tv_vol_down
    then:
      - homeassistant.service:
          service: media_player.volume_down
          data:
            entity_id: media_player.living_room
  - id: lr_tv_select_source
    parameters:
      source: string
    then:
      - homeassistant.service:
          service: media_player.select_source
          data_template:
            entity_id: media_player.living_room
            source: !lambda "return source;"

output:
  - platform: gpio
    pin: GPIO11
    id: backlight

light:
  - platform: binary
    name: Backlight
    id: backlight_light
    output: backlight
    restore_mode: ALWAYS_ON

button:
  - platform: template
    name: "Show Diagnostics"
    on_press:
      - lambda: |-
          if (id(active_room) != 4) id(previous_room) = id(active_room);
          id(active_room) = 4;
          id(t5_display).request_full_refresh();
          id(t5_display).update();

switch:
  # When ON: plugging the device into any charger switches to the clock
  # face; unplugging returns to the previous room.  Default OFF.  Toggle
  # from Home Assistant (or from the device's HA card).
  - platform: template
    name: "Auto Clock When Charging"
    id: auto_clock_when_charging
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # Take effect immediately on toggle.
    on_turn_on:
      - lambda: |-
          if (id(t5_display).charger_present()) {
            if (id(active_room) != 3) id(previous_room) = id(active_room);
            id(active_room) = 3;
            id(was_on_charger) = true;
            id(t5_display).request_full_refresh();
            id(t5_display).update();
          }
    on_turn_off:
      - lambda: |-
          if (id(active_room) == 3) {
            id(active_room) = id(previous_room);
            id(was_on_charger) = false;
            id(t5_display).request_full_refresh();
            id(t5_display).update();
          }

image:
  - file: images/lightbulb-on.svg
    id: img_bulb_on
    resize: 60x60
    type: BINARY
  - file: images/lightbulb-off.svg
