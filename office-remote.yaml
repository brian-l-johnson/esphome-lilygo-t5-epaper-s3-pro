display:
  - platform: t5s3_epaper
    id: t5_display
    rotation: 270
    # Render is driven by request_refresh() on HA state changes + update() on
    # touch. update_interval just acts as a long keepalive so the battery icon
    # and HA-connection indicator stay fresh during long quiet periods.
    update_interval: 30min
    lambda: |-
      // Portrait: 540px wide x 960px tall
      auto black = Color(0, 0, 0);
      auto white = Color(255, 255, 255);
      auto gray  = Color(180, 180, 180);
      const int W = 540;

      it.fill(white);

      // ── Boot screen ──────────────────────────────────────────────────────
      // Shown until WiFi+HA are both up (or the 30s timeout in esphome.on_boot).
      if (!id(boot_done)) {
        it.print(W / 2, 220, id(roboto32), black, TextAlign::TOP_CENTER, "LilyGo T5 S3 Pro");
        it.print(W / 2, 270, id(roboto20), black, TextAlign::TOP_CENTER, "ESPHome E-Paper Remote");
        it.horizontal_line(W / 2 - 80, 320, 160, black);

        bool wifi_ok = id(wifi_ip).has_state() && id(wifi_ip).state.length() > 0
                        && id(wifi_ip).state != std::string("0.0.0.0");
        bool ha_ok = global_api_server->is_connected();

        it.print(W / 2, 400, id(roboto24), black, TextAlign::TOP_CENTER,
                 ha_ok ? "Ready" : (wifi_ok ? "Connecting to Home Assistant…" : "Connecting to Wi-Fi…"));

        if (wifi_ok) {
          it.printf(W / 2, 460, id(roboto20), black, TextAlign::TOP_CENTER,
                    "%s", id(wifi_ip).state.c_str());
        }

        it.printf(W / 2, 880, id(roboto16), black, TextAlign::TOP_CENTER,
                  "ESPHome %s", ESPHOME_VERSION);
        return;
      }

      // ── Top bar (y 0–80): current room + chevron + backlight ─────────────
      static const char *room_names[] = {"Office", "Living Room", "Climate", "Clock", "Diagnostics", "Living Room TV"};
      int room_idx = id(active_room);
      if (room_idx < 0 || room_idx > 5) room_idx = 0;
      const char *room_name = room_names[room_idx];

      // Room selector button (x 0–420): filled black
      it.filled_rectangle(0, 0, 420, 80, black);
      it.print(24, 40, id(roboto24), white, TextAlign::CENTER_LEFT, room_name);
      it.print(400, 40, id(mdi40), white, TextAlign::CENTER_RIGHT,
               id(show_room_picker) ? "\U000F0143" : "\U000F0140");  // chevron-up/down

      // Backlight toggle (x 420–540)
      it.rectangle(420, 0, 120, 80, black);
      it.print(480, 40, id(roboto20), black, TextAlign::CENTER, "Backlight");

      // ── Divider ──────────────────────────────────────────────────────────
      it.horizontal_line(0, 84, W, black);

      // ── Stale-data banner (HA disconnected) ──────────────────────────────
      // Fits in the gap between divider y=84 and content y=100.
      bool ha_connected_top = global_api_server->is_connected();
      if (!ha_connected_top) {
        id(t5_display).fast_rect(0, 86, W, 14, black);
        it.print(W / 2, 93, id(roboto16), white, TextAlign::CENTER,
                 "OFFLINE — LAST KNOWN STATE");
      }

      // ── Control rows ─────────────────────────────────────────────────────
      // Each row: 16px margin, 110px tall, icon left, label centre, badge right.
      auto draw_row = [&](int row_y, esphome::image::Image *icon,
                          const char *label, const char *sublabel, bool is_on) {
        Color row_fg = is_on ? white : black;
        Color row_bg = is_on ? black : white;

        if (is_on)
          id(t5_display).fast_rect(16, row_y, W - 32, 106, black);
        else
          it.rectangle(16, row_y, W - 32, 106, black);

        // Icon — BINARY images support fg/bg color args
        it.image(50, row_y + 53, icon, ImageAlign::CENTER, row_fg, row_bg);

        // Label
        it.print(130, row_y + (sublabel[0] ? 30 : 53), id(roboto24), row_fg,
                 TextAlign::CENTER_LEFT, label);
        if (sublabel[0])
          it.print(130, row_y + 66, id(roboto16), row_fg,
                   TextAlign::CENTER_LEFT, sublabel);

        // ON/OFF badge
        it.print(W - 26, row_y + 53, id(roboto20), row_fg,
                 TextAlign::CENTER_RIGHT, is_on ? "ON" : "OFF");
      };

      if (id(active_room) == 0) {
        int opt_ol = id(t5_display).get_optimistic(0);
        bool lights_on = (opt_ol >= 0) ? (opt_ol == 1)
            : (id(office_lights_state).has_state() && id(office_lights_state).state);
        draw_row(100, lights_on ? id(img_bulb_on) : id(img_bulb_off),
                 "Office Lights", "", lights_on);

        // ── Brightness slider (y 212–260, only when lights ON) ───────────────
        if (lights_on) {
          float bpct = id(office_lights_brightness).has_state()
                     ? id(office_lights_brightness).state / 255.0f * 100.0f : 0.0f;
          it.print(28, 212, id(roboto16), black, TextAlign::TOP_LEFT, "Brightness");
          it.printf(W - 28, 212, id(roboto16), black, TextAlign::TOP_RIGHT, "%.0f%%", bpct);
          it.rectangle(28, 230, W - 56, 24, black);
          int bw = (int)((W - 56) * bpct / 100.0f);
          if (bw > 0) it.filled_rectangle(28, 230, bw, 24, black);
          // Thumb: tall mark spanning above + below the bar so it's visible at 0% and 100%
          int bt = 28 + bw;
          it.filled_rectangle(bt - 3, 224, 6, 36, black);
          it.filled_rectangle(bt - 1, 228, 2, 28, white);
        }

        // ── Plexamp media row (y 268–448, 180px) ────────────────────────────
        {
          std::string state  = id(plexamp_state).has_state()  ? id(plexamp_state).state  : std::string("off");
          std::string title  = id(plexamp_title).has_state()  ? id(plexamp_title).state  : std::string("");
          std::string artist = id(plexamp_artist).has_state() ? id(plexamp_artist).state : std::string("");
          bool playing = (state == "playing");
          bool active  = (state == "playing" || state == "paused");

          it.rectangle(16, 268, W - 32, 180, black);

          it.image(50, 318, id(img_music), ImageAlign::CENTER, black, white);
          it.print(90, 280, id(roboto20), black, TextAlign::CENTER_LEFT, "Plexamp");

          const char *state_label = playing ? "PLAYING" : (state == "paused" ? "PAUSED" : "OFF");
          if (active) {
            it.filled_rectangle(330, 276, 194, 36, black);
            it.print(427, 294, id(roboto16), white, TextAlign::CENTER, state_label);
          } else {
            it.rectangle(330, 276, 194, 36, black);
            it.print(427, 294, id(roboto16), black, TextAlign::CENTER, state_label);
          }

          auto trunc = [](const std::string &s) -> std::string {
            return s.length() > 36 ? s.substr(0, 34) + ".." : s;
          };
          if (!title.empty())
            it.print(90, 312, id(roboto16), black, TextAlign::CENTER_LEFT, trunc(title).c_str());
          if (!artist.empty())
            it.print(90, 333, id(roboto16), black, TextAlign::CENTER_LEFT, trunc(artist).c_str());

          it.horizontal_line(28, 360, W - 56, black);

          // Transport buttons (y 368–438): [⏮ PREV] [⏯ PLAY/PAUSE] [⏭ NEXT]
          it.rectangle(28,  368, 152, 70, black);
          it.rectangle(188, 368, 152, 70, black);
          it.rectangle(348, 368, 152, 70, black);
          it.print(104, 403, id(mdi40), black, TextAlign::CENTER, "\U000F04AE");  // skip-previous
          it.print(264, 403, id(mdi40), black, TextAlign::CENTER,
                   playing ? "\U000F03E4" : "\U000F040A");                         // pause / play
          it.print(424, 403, id(mdi40), black, TextAlign::CENTER, "\U000F04AD");  // skip-next
        }

        // ── Volume slider (y 454–502) ─────────────────────────────────────────
        {
          float vpct = id(plexamp_volume).has_state() ? id(plexamp_volume).state * 100.0f : 0.0f;
          it.print(28, 454, id(roboto16), black, TextAlign::TOP_LEFT, "Volume");
          it.printf(W - 28, 454, id(roboto16), black, TextAlign::TOP_RIGHT, "%.0f%%", vpct);
          it.rectangle(28, 472, W - 56, 24, black);
          int vw = (int)((W - 56) * vpct / 100.0f);
          if (vw > 0) it.filled_rectangle(28, 472, vw, 24, black);
          int vt = 28 + vw;
          it.filled_rectangle(vt - 3, 466, 6, 36, black);
          it.filled_rectangle(vt - 1, 470, 2, 28, white);
        }
      } else if (id(active_room) == 1) {
        auto eff = [&](uint8_t slot, auto sensor) -> bool {
          int opt = id(t5_display).get_optimistic(slot);
          if (opt >= 0) return opt == 1;
          return sensor->has_state() && sensor->state;
        };
        bool main_on     = eff(1, id(living_room_main_state));
        bool upstairs_on = eff(2, id(living_room_upstairs_state));
        bool fan_on      = eff(3, id(ceiling_fan_state));

        draw_row(100, main_on ? id(img_bulb_on) : id(img_bulb_off),
                 "Main Lights", "", main_on);
        draw_row(220, upstairs_on ? id(img_bulb_on) : id(img_bulb_off),
                 "Upstairs Lights", "", upstairs_on);
        draw_row(340, id(img_fan), "Ceiling Fan", "", fan_on);
      } else if (id(active_room) == 2) {
        // ── Climate tab ──────────────────────────────────────────────────────
        // HA already reports temperatures in °F — display directly
        auto fmt_temp_f = [](float f) -> std::string {
          if (isnan(f)) return std::string("--°F");
          char buf[12];
          snprintf(buf, sizeof(buf), "%.0f°F", f);
          return std::string(buf);
        };

        // ── draw_thermo_row: 220px tall thermostat control row ──────────────
        auto draw_thermo_row = [&](int row_y, const char *label,
                                   float cur_c, float set_c,
                                   const std::string &hvac_mode,
                                   const std::string &hvac_action) {
          it.rectangle(16, row_y, W - 32, 220, black);

          // Thermometer icon (top-left area)
          it.print(58, row_y + 55, id(mdi40), black, TextAlign::CENTER, "\U000F050F");

          // Label + current temp (top-left, beside icon)
          it.print(90, row_y + 24, id(roboto20), black, TextAlign::CENTER_LEFT, label);
          std::string cur_str = fmt_temp_f(cur_c);
          it.print(90, row_y + 60, id(roboto24), black, TextAlign::CENTER_LEFT, cur_str.c_str());

          // Mode badge (top-right, tappable, x 340–524)
          const char *mode_label = "---";
          bool active = false;
          if (hvac_mode == "heat") { mode_label = "HEAT"; active = (hvac_action == "heating"); }
          else if (hvac_mode == "cool") { mode_label = "COOL"; active = (hvac_action == "cooling"); }
          else if (hvac_mode == "off")  { mode_label = "OFF";  active = false; }
          if (active) {
            it.filled_rectangle(340, row_y + 8, 184, 56, black);
            it.print(432, row_y + 36, id(roboto24), white, TextAlign::CENTER, mode_label);
          } else {
            it.rectangle(340, row_y + 8, 184, 56, black);
            it.print(432, row_y + 36, id(roboto24), black, TextAlign::CENTER, mode_label);
          }

          // Divider between info and button area
          it.horizontal_line(28, row_y + 106, W - 56, black);

          // Minus button (x 40–190, 80px tall)
          it.rectangle(40, row_y + 122, 150, 80, black);
          it.print(115, row_y + 162, id(roboto24), black, TextAlign::CENTER, "-");
          // Setpoint value (center)
          std::string set_str = fmt_temp_f(set_c);
          it.print(270, row_y + 162, id(roboto24), black, TextAlign::CENTER, set_str.c_str());
          // Plus button (x 320–470, 80px tall)
          it.rectangle(320, row_y + 122, 150, 80, black);
          it.print(395, row_y + 162, id(roboto24), black, TextAlign::CENTER, "+");
        };

        float cur1   = id(thermo_current_temp).has_state()    ? id(thermo_current_temp).state    : NAN;
        float set1   = id(thermo_set_temp).has_state()        ? id(thermo_set_temp).state         : NAN;
        float cur2   = id(thermo_up_current_temp).has_state() ? id(thermo_up_current_temp).state  : NAN;
        float set2   = id(thermo_up_set_temp).has_state()     ? id(thermo_up_set_temp).state      : NAN;
        std::string mode1   = id(thermo_hvac_mode).has_state()    ? id(thermo_hvac_mode).state    : std::string("");
        std::string action1 = id(thermo_mode).has_state()         ? id(thermo_mode).state          : std::string("");
        std::string mode2   = id(thermo_up_hvac_mode).has_state() ? id(thermo_up_hvac_mode).state : std::string("");
        std::string action2 = id(thermo_up_mode).has_state()      ? id(thermo_up_mode).state      : std::string("");
        int opt_hrv = id(t5_display).get_optimistic(4);
        bool hrv_on = (opt_hrv >= 0) ? (opt_hrv == 1)
            : (id(hrv_state).has_state() && id(hrv_state).state);

        // Thermo row 1: y=100–320, Thermo row 2: y=336–556, HRV: y=572–692
        draw_thermo_row(100, "Main Thermostat",     cur1, set1, mode1, action1);
        draw_thermo_row(336, "Upstairs Thermostat", cur2, set2, mode2, action2);
        draw_row(572, id(img_fan), "HRV", "", hrv_on);
      } else if (id(active_room) == 3) {
        // ── Clock face (auto-shown when on charger) ─────────────────────────
        // Big time at the visual center, day + date underneath.
        it.strftime(W / 2, 260, id(roboto160), black,
                    TextAlign::TOP_CENTER, "%H:%M", id(ntp).now());
        it.strftime(W / 2, 480, id(roboto32), black,
                    TextAlign::TOP_CENTER, "%A", id(ntp).now());
        it.strftime(W / 2, 530, id(roboto32), black,
                    TextAlign::TOP_CENTER, "%B %d, %Y", id(ntp).now());
        // Footer hint
        it.print(W / 2, 720, id(roboto20), black, TextAlign::TOP_CENTER,
                 "Unplug to return to the remote");
      } else if (id(active_room) == 4) {
        // ── Diagnostics view ────────────────────────────────────────────────
        it.print(28, 100, id(roboto24), black, TextAlign::TOP_LEFT, "Diagnostics");
        it.horizontal_line(28, 134, W - 56, black);

        int dy = 150;
        auto section = [&](const char *title) {
          it.print(28, dy, id(roboto20), black, TextAlign::TOP_LEFT, title);
          dy += 26;
        };

        // Battery
        section("Battery");
        float bp = id(t5_display).get_battery_pct();
        float bm = id(t5_display).get_battery_mv();
        float ba = id(t5_display).get_battery_ma();
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "%.0f%%   %.2f V   %s%d mA",
                  bp, bm / 1000.0f, ba >= 0 ? "+" : "", (int)ba);
        dy += 22;

        // Charger
        section("Charger (BQ25896)");
        static const char *vbus_names[] = {"None", "USB SDP", "Adapter", "—", "—", "—", "—", "OTG"};
        static const char *cstate_names[] = {"Not Charging", "Pre-Charge", "Fast Charge", "Done"};
        uint8_t vbus = id(t5_display).get_charger_vbus();
        uint8_t cstate = id(t5_display).get_charger_state();
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "VBUS: %s", vbus_names[vbus & 0x07]);
        dy += 22;
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "State: %s", cstate_names[cstate & 0x03]);
        dy += 30;

        // Wi-Fi
        section("Wi-Fi");
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "IP: %s", id(wifi_ip).has_state() ? id(wifi_ip).state.c_str() : "—");
        dy += 22;
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "SSID: %s", id(wifi_ssid).has_state() ? id(wifi_ssid).state.c_str() : "—");
        dy += 30;

        // Home Assistant
        section("Home Assistant");
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "API: %s", global_api_server->is_connected() ? "Connected" : "Disconnected");
        dy += 30;

        // System
        section("System");
        uint32_t up = millis() / 1000;
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "Uptime: %lud %luh %lum",
                  (unsigned long)(up / 86400), (unsigned long)((up / 3600) % 24),
                  (unsigned long)((up / 60) % 60));
        dy += 22;
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "Free heap: %u KB", esp_get_free_heap_size() / 1024u);
        dy += 22;
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "Free PSRAM: %u KB",
                  (unsigned)(heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024u));
        dy += 22;
        it.printf(50, dy, id(roboto16), black, TextAlign::TOP_LEFT,
                  "ESPHome: %s", ESPHOME_VERSION);

        // Footer hint
        it.print(W / 2, 740, id(roboto16), black, TextAlign::TOP_CENTER,
                 "Tap the top bar to leave");
      } else if (id(active_room) == 5) {
        // ── Living Room TV remote (Savant zone) ─────────────────────────────
        std::string st  = id(lr_tv_state).has_state()  ? id(lr_tv_state).state  : std::string("");
        std::string src = id(lr_tv_source).has_state() ? id(lr_tv_source).state : std::string("");
        bool tv_on = !st.empty() && st != "off" && st != "unavailable" && st != "unknown";

        // Header (y 100–176): zone label + state, power button on the right
        it.rectangle(16, 100, W - 32, 76, black);
        it.print(32, 124, id(roboto24), black, TextAlign::CENTER_LEFT, "Living Room TV");
        it.print(32, 154, id(roboto16), black, TextAlign::CENTER_LEFT, tv_on ? "ON" : "OFF");
        if (tv_on) {
          id(t5_display).fast_rect(384, 108, 140, 60, black);
          it.print(454, 138, id(roboto20), white, TextAlign::CENTER, "POWER");
        } else {
          it.rectangle(384, 108, 140, 60, black);
          it.print(454, 138, id(roboto20), black, TextAlign::CENTER, "POWER");
        }

        // Input selector button (y 188–252)
        it.rectangle(16, 188, W - 32, 64, black);
        it.print(32, 220, id(roboto20), black, TextAlign::CENTER_LEFT, "Input");
        std::string src_label = src.empty() ? std::string("—") : src;
        if (src_label.length() > 22) src_label = src_label.substr(0, 20) + "..";
        it.print(W - 32, 220, id(roboto20), black, TextAlign::CENTER_RIGHT, src_label.c_str());

        // D-pad cluster: up / left-select-right / down (chevron glyphs)
        auto dpad = [&](int x, int y, const char *glyph, const char *label) {
          it.rectangle(x, y, 120, 100, black);
          if (glyph) it.print(x + 60, y + 50, id(mdi40), black, TextAlign::CENTER, glyph);
          if (label) it.print(x + 60, y + 50, id(roboto32), black, TextAlign::CENTER, label);
        };
        dpad(84,  280, nullptr, "HOME");         // home (nav) — top-left of cross
        dpad(210, 280, "\U000F0143", nullptr);  // up
        dpad(84,  388, "\U000F0141", nullptr);  // left
        dpad(210, 388, nullptr, "OK");          // select
        dpad(336, 388, "\U000F0142", nullptr);  // right
        dpad(210, 496, "\U000F0140", nullptr);  // down

        // Volume rocker (y 626–722) with current zone level above
        float vpct = id(lr_tv_volume).has_state() ? id(lr_tv_volume).state * 100.0f : NAN;
        if (!isnan(vpct))
          it.printf(W / 2, 604, id(roboto16), black, TextAlign::TOP_CENTER, "Volume  %.0f%%", vpct);
        else
          it.print(W / 2, 604, id(roboto16), black, TextAlign::TOP_CENTER, "Volume");
        it.rectangle(84, 626, 186, 96, black);
        it.print(177, 674, id(roboto32), black, TextAlign::CENTER, "VOL -");
        it.rectangle(276, 626, 186, 96, black);
        it.print(369, 674, id(roboto32), black, TextAlign::CENTER, "VOL +");
      }

      // ── Room picker overlay ───────────────────────────────────────────────
      if (id(show_room_picker)) {
        static const char *picker_rooms[]   = {"Office", "Living Room", "Climate", "Living Room TV"};
        static const int    picker_indices[] = {0, 1, 2, 5};
        const int NP = sizeof(picker_indices) / sizeof(picker_indices[0]);
        // Rows start y=220, 116px tall, 120px pitch; last row bottom = 694.
        int panel_h = 220 + NP * 120 - 2 + 116 - 160 + 56;  // rows + cancel margin

        id(t5_display).fast_rect(30, 160, W - 60, panel_h, white);
        it.rectangle(30, 160, W - 60, panel_h, black);
        it.rectangle(31, 161, W - 62, panel_h - 2, black);  // double border

        it.print(W / 2, 185, id(roboto24), black, TextAlign::CENTER, "Select Room");
        it.horizontal_line(30, 210, W - 60, black);

        for (int i = 0; i < NP; i++) {
          int ry = 220 + i * 120;
          if (picker_indices[i] == id(active_room)) {
            id(t5_display).fast_rect(32, ry - 2, W - 64, 116, black);
            it.print(80, ry + 55, id(roboto24), white, TextAlign::CENTER_LEFT, picker_rooms[i]);
            it.print(W / 2 + 160, ry + 55, id(mdi40), white, TextAlign::CENTER_RIGHT, "\U000F05E0");  // check-circle
          } else {
            it.rectangle(32, ry - 2, W - 64, 116, black);
            it.print(80, ry + 55, id(roboto24), black, TextAlign::CENTER_LEFT, picker_rooms[i]);
          }
        }

        // Cancel button (inside panel, below the last row)
        int cancel_y = 220 + NP * 120 - 2 + 116 + 8;
        it.rectangle(120, cancel_y, 300, 30, black);
        it.print(W / 2, cancel_y + 15, id(roboto16), black, TextAlign::CENTER, "Cancel");
      }

      // ── Input picker overlay (Living Room TV) ─────────────────────────────
      if (id(show_input_picker)) {
        auto &srcs = id(tv_source_list);
        int n = (int)srcs.size();
        // Rows start y=200, 80px tall, 84px pitch (matching touch handler).
        int panel_h = (n > 0 ? 200 + n * 84 + 8 + 34 : 200 + 90) - 140 + 16;

        id(t5_display).fast_rect(30, 140, W - 60, panel_h, white);
        it.rectangle(30, 140, W - 60, panel_h, black);
        it.rectangle(31, 141, W - 62, panel_h - 2, black);

        it.print(W / 2, 165, id(roboto24), black, TextAlign::CENTER, "Select Input");
        it.horizontal_line(30, 190, W - 60, black);

        if (n == 0) {
          it.print(W / 2, 235, id(roboto16), black, TextAlign::TOP_CENTER,
                   "No sources yet (source_list empty)");
        } else {
          std::string cur = id(lr_tv_source).has_state() ? id(lr_tv_source).state : std::string("");
          for (int i = 0; i < n; i++) {
            int ry = 200 + i * 84;
            if (cur == srcs[i]) {
              id(t5_display).fast_rect(40, ry, W - 80, 80, black);
              it.print(64, ry + 40, id(roboto24), white, TextAlign::CENTER_LEFT, srcs[i].c_str());
              it.print(W - 64, ry + 40, id(mdi40), white, TextAlign::CENTER_RIGHT, "\U000F05E0");  // check-circle
            } else {
              it.rectangle(40, ry, W - 80, 80, black);
              it.print(64, ry + 40, id(roboto24), black, TextAlign::CENTER_LEFT, srcs[i].c_str());
            }
          }
        }

        int cancel_y = (n > 0 ? 200 + n * 84 + 8 : 290);
        it.rectangle(120, cancel_y, 300, 34, black);
        it.print(W / 2, cancel_y + 17, id(roboto20), black, TextAlign::CENTER, "Cancel");
      }

      // ── Bottom info strip ─────────────────────────────────────────────────
      it.horizontal_line(0, 820, W, black);

      // HA connection status
      bool ha_connected = global_api_server->is_connected();
      it.print(16, 820, id(mdi40), black, TextAlign::TOP_LEFT,
               ha_connected ? "\U000F05E0" : "\U000F0159");
      it.print(58, 833, id(roboto16), black, TextAlign::TOP_LEFT,
               ha_connected ? "Home Assistant" : "Disconnected");

      // Battery info
      {
        float pct_f = id(t5_display).get_battery_pct();
        float mv_f  = id(t5_display).get_battery_mv();
        float ma_f  = id(t5_display).get_battery_ma();

        if (!isnan(pct_f) && pct_f >= 0) {
          int pct = (int)pct_f;
          // "Charging" = USB plugged in. Don't use ma_f > 0 — the gauge's
          // current goes to ~0 once the battery is topped off (CV taper),
          // even though USB is still connected.
          bool charging = id(t5_display).charger_present();

          // Pick the right MDI battery icon
          const char *bat_icon;
          if (charging) {
            if      (pct >= 90) bat_icon = "\U000F0085";  // charging-100
            else if (pct >= 70) bat_icon = "\U000F008B";  // charging-90
            else if (pct >= 55) bat_icon = "\U000F008A";  // charging-80
            else if (pct >= 45) bat_icon = "\U000F0089";  // charging-60
            else if (pct >= 35) bat_icon = "\U000F0088";  // charging-40
            else if (pct >= 25) bat_icon = "\U000F0087";  // charging-30
            else                bat_icon = "\U000F0086";  // charging-20
          } else {
            if      (pct >= 95) bat_icon = "\U000F0079";  // battery (100%)
            else if (pct >= 85) bat_icon = "\U000F0082";  // battery-90
            else if (pct >= 75) bat_icon = "\U000F0081";  // battery-80
            else if (pct >= 65) bat_icon = "\U000F0080";  // battery-70
            else if (pct >= 55) bat_icon = "\U000F007F";  // battery-60
            else if (pct >= 45) bat_icon = "\U000F007E";  // battery-50
            else if (pct >= 35) bat_icon = "\U000F007D";  // battery-40
            else if (pct >= 25) bat_icon = "\U000F007C";  // battery-30
            else if (pct >= 15) bat_icon = "\U000F007B";  // battery-20
            else if (pct >= 5)  bat_icon = "\U000F007A";  // battery-10
            else                bat_icon = "\U000F0083";  // battery-alert
          }

          it.print(W - 20, 830, id(mdi40), black, TextAlign::TOP_RIGHT, bat_icon);
          it.printf(W - 64, 845, id(roboto16), black, TextAlign::TOP_RIGHT, "%d%%", pct);

          if (!isnan(mv_f) && mv_f > 0) {
            int ma = (int)ma_f;
            it.printf(W - 20, 868, id(roboto16), black, TextAlign::TOP_RIGHT,
                      "%.2fV %s%dmA",
                      mv_f / 1000.0f, ma >= 0 ? "+" : "", ma);
          }
        }
      }